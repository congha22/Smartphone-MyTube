name: BrowserHost build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-browserhost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore BrowserHost/SmartphoneMyTube.BrowserHost.csproj -r linux-x64
      - name: Build
        run: dotnet build BrowserHost/SmartphoneMyTube.BrowserHost.csproj -c Release -r linux-x64 --no-restore
